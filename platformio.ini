; PIDlampada - Camara Termica Compacta com Controle PWM
; UNIP - Engenharia de Computacao - Projeto Integrador 8o semestre

[platformio]
default_envs = wokwi
src_dir = src
lib_dir = lib

; ---------------------------------------------------------------------------
; Base comum dos alvos ESP32
; ---------------------------------------------------------------------------
[esp32_base]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    -std=gnu++17
    -Wall
build_unflags = -std=gnu++11
extra_scripts = post:scripts/merge_bin.py

; ---------------------------------------------------------------------------
; Hardware real: sensor LM35 no ADC1, tempo real (amostragem de 60 s).
; Wi-Fi so liga se existir include/secrets.h (ver secrets.example.h).
; ---------------------------------------------------------------------------
[env:esp32dev]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D SENSOR_SOURCE=SENSOR_LM35
    -D SIM_TIME_SCALE=1

; ---------------------------------------------------------------------------
; Wokwi: planta termica e bateria simuladas, tempo acelerado 60x
; (1 s de parede = 60 s de modelo -> um ensaio de 1 h roda em 1 min).
; Conecta na rede Wokwi-GUEST e publica no broker MQTT.
; ---------------------------------------------------------------------------
[env:wokwi]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D WOKWI
    -D SENSOR_SOURCE=SENSOR_PLANT
    -D SIM_TIME_SCALE=60

; ---------------------------------------------------------------------------
; Wokwi alternativo: le o NTC da simulacao (arraste a temperatura na tela)
; ---------------------------------------------------------------------------
[env:wokwi_ntc]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D WOKWI
    -D SENSOR_SOURCE=SENSOR_NTC
    -D SIM_TIME_SCALE=10

; ---------------------------------------------------------------------------
; Testes unitarios na maquina (sem hardware) - lib/control e' puro C++
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -D UNIT_TEST
lib_compat_mode = off
